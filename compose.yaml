services:
    app:
        build:
            context: .
            target: production
            args:
                VITE_APP_NAME: ${APP_NAME:-Laravel}
        restart: unless-stopped
        env_file: .env
        environment:
            APP_KEY: ${APP_KEY:?Set APP_KEY in .env}
            APP_URL: https://${APP_DOMAIN:?Set APP_DOMAIN in .env}

            # --- Domain + automatic HTTPS (Caddy / Let's Encrypt) ---
            CADDY_AUTO_HTTPS: "on"
            CADDY_HTTPS_SERVER_ADDRESS: https://${APP_DOMAIN}
            SSL_MODE: "full"

            # --- Laravel automations on every container start ---
            AUTORUN_ENABLED: "true"
            AUTORUN_LARAVEL_MIGRATION: "true"
            # SQLite is a local file, there is no database server to wait for
            AUTORUN_LARAVEL_MIGRATION_SKIP_DB_CHECK: "true"
            AUTORUN_LARAVEL_STORAGE_LINK: "true"

            # --- PHP ---
            PHP_OPCACHE_ENABLE: "1"
            PHP_UPLOAD_MAX_FILE_SIZE: "100M"
        ports:
            - "80:8080"
            - "443:8443"
            - "443:8443/udp"
        volumes:
            - storage:/var/www/html/storage
            - caddy_data:/data
            - caddy_config:/config
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"

volumes:
    storage:
    caddy_data:
    caddy_config:
